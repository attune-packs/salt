  source_version: "3.0.1"
  source_revision: "f053dcedea737c3632d88b7b7e7671ca93e81bd2"
  source_tag: "v3.0.1"
  license: "Apache-2.0"
  salt_api_reviewed_version: "3008.1-2"

tags: [salt, saltstack, configuration-management, netapi, integration]
runtime_deps: [python]
dependencies: []

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_pack.py
      timeout: 120
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block
