author: "Attune"
email: "support@attune.systems"
system: false
enabled: true

conf_schema: {}
config: {}

meta:
  category: integration
  documentation_url: "https://github.com/attune-packs/salt"
  repository_url: "https://github.com/attune-packs/salt"
