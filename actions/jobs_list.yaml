ref: salt.jobs_list
label: "List Salt Jobs"
description: "List jobs visible in the Salt master job cache through /jobs"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: salt_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [privileged]
parameters:
  credential_key: {type: string, default: salt.credentials, required: true}
output:
  operation: {type: string, required: true}
  data: {type: any, required: true}
  meta: {type: object, required: true}
  jid: {type: string}
  minions: {type: array}
tags: [salt, jobs, privileged, read]
