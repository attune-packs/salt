ref: salt.file_inspect
label: "Inspect Minion File"
description: "Check an absolute path's file/directory existence or SHA-256 hash without mutation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: salt_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: salt.credentials, required: true}
  target: {type: string, required: true}
  expr_form: {type: string, enum: [glob, list, grain, grain_pcre, pillar, pillar_pcre, nodegroup, compound, ipcidr, pcre], default: glob}
  confirm_broad_target: {type: boolean, default: false}
  action: {type: string, enum: [file_exists, directory_exists, sha256], required: true}
  path: {type: string, required: true, max_length: 4096}
  async: {type: boolean, default: false}
  salt_timeout_seconds: {type: integer, minimum: 1, maximum: 300, default: 30}
output:
  operation: {type: string, required: true}
  data: {type: any, required: true}
  meta: {type: object, required: true}
  jid: {type: string}
  minions: {type: array}
tags: [salt, minion, file, read]
